<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Page not found - FixMaster Appliance Repair" />
  <title>404 — Page Not Found | FixMaster</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" /><link rel="stylesheet" href="css/animations.css" /><link rel="stylesheet" href="css/dark-mode.css" />
</head>
<body>
<div id="preloader"><div class="preloader-logo"><div style="width:64px;height:64px;background:linear-gradient(135deg,#E8A020,#D9580A);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem"><svg width="36" height="36" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><p style="color:white;font-family:'Sora',sans-serif;font-size:1.25rem;font-weight:600;letter-spacing:0.02em;text-align:center">FixMaster</p></div><div class="preloader-bar"><div class="preloader-fill"></div></div></div>

<!-- SECTION 1: MAIN 404 -->
<section style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--color-navy-dark) 0%,var(--color-navy) 100%);padding:6rem var(--container-pad);position:relative;overflow:hidden" aria-label="404 error">
  <div style="position:absolute;inset:0;background-image:radial-gradient(circle at 70% 30%,rgba(217,88,10,0.1) 0%,transparent 60%),radial-gradient(circle at 20% 70%,rgba(232,160,32,0.12) 0%,transparent 55%)"></div>

  <!-- Floating gear decorations -->
  <div style="position:absolute;top:20%;right:8%;opacity:0.04;animation:spinSlow 20s linear infinite"><svg width="300" height="300" viewBox="0 0 24 24" fill="white"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>

  <div style="text-align:center;position:relative;z-index:1;max-width:700px;margin-inline:auto">
    <!-- 404 number -->
    <div style="font-family:'Sora',sans-serif;font-size:clamp(7rem,20vw,14rem);font-weight:600;line-height:1;background:linear-gradient(135deg,var(--color-orange-light),var(--color-orange),var(--color-orange-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.05em;animation:fadeInUp 0.6s ease" aria-label="404">404</div>

    <h1 style="font-family:'Sora',sans-serif;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:600;color:white;margin-bottom:1rem;line-height:1.2">Oops! This Page Isn't Working</h1>
    <p style="color:rgba(255,255,255,0.85);font-size:1.05rem;line-height:1.75;margin-bottom:2.5rem;max-width:500px;margin-inline:auto">Just like a broken appliance, this page needs some attention. The page you're looking for doesn't exist or has been moved.</p>

    <!-- CTA buttons -->
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem">
      <a href="index.html" class="btn btn-orange btn-lg">
        <svg width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
      <a href="services.html" class="btn btn-ghost btn-lg">View Services</a>
    </div>

    <!-- Redirect Countdown -->
    <div id="redirect-container" class="reveal">
      <p style="color:rgba(255,255,255,0.85);font-size:0.9rem">You'll be automatically redirected to the homepage in <span id="countdown" style="font-weight:600;color:var(--color-orange-light)">15</span> seconds.</p>
      <button onclick="clearInterval(window.countdownInterval);document.getElementById('redirect-container').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,0.75);font-size:0.8rem;cursor:pointer;text-decoration:underline;margin-top:0.5rem">Cancel redirect</button>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
<script src="js/booking.js"></script>
<script>
  // Auto redirect countdown
  let secs = 15;
  window.countdownInterval = setInterval(function(){
    secs--;
    const el = document.getElementById('countdown');
    if(el) el.textContent = secs;
    if(secs <= 0){ clearInterval(window.countdownInterval); window.location.href = 'index.html'; }
  }, 1000);
</script>
</body>
</html>
